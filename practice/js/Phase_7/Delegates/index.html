<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="container-add-todo">
        <input
          type="text"
          class="input-todo"
          placeholder="Введите новое дело"
        />
        <button class="btn-add-todo">Добавить</button>
      </div>
      <div class="container-todo">
        <h1>Дела на сегодня</h1>
        <ul class="todo-list">
          <li class="todo">
            ПРИМЕР: Потрогать траву <button class="del">X</button>
          </li>
          <li class="todo">
            ПРИМЕР: Выкопать траву <button class="del">X</button>
          </li>
        </ul>
      </div>
    </div>
    <script src="delegation.js"></script>
  </body>
</html>
